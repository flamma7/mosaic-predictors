[project]
name = "mosaic-predictors"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Luke Barbier", email = "lukebarbier12@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.2",
    "stable-worldmodel[env]",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
mosaic-predictors = "mosaic_predictors:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
stable-worldmodel = { path = "../stable-worldmodel", editable = true }
