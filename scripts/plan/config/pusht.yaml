defaults:
  - launcher: local
  - solver: cem
  - objective: goal_mse
  - _self_

world:
  env_name: swm/PushT-v1
  num_envs: ${eval.num_eval}
  max_episode_steps: ??? # make sure it's >= eval_budget

dataset:
  stats: ${eval.dataset_name}
  keys_to_cache:
    - action
    - proprio
    - state

seed: 42
policy: random # ckpt name or random

# Completed pairs kept per candidate during rollout. null keeps them all.
# 2 retains memories from the previous 2 states, then drops the oldest.
max_memory: null

plan_config:
  horizon: 5
  receding_horizon: 5
  action_block: 5 # frameskip
  history_len: 3  # context frames (block timesteps) fed to the world model;
  #                 # match the training history_size. Rollout-based models only
  #                 # (LeWM/PLDM/PreJEPA) — TD-MPC2 requires the default of 1.
  #                 # For MoPWM the pair cap is max_memory, not history_len.

# evaluation from dataset (replay expert trajectories)
eval:
  num_eval: 50
  goal_offset_steps: 25
  eval_budget: 50
  img_size: 224
  dataset_name: pusht_expert_train.lance
  callables:
    # -- set state
    - method: _set_state
      args:
        state:
          value: state
    # -- set goal state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

compile: false
bf16: true
# null skips eval mp4s. World.evaluate records only when video is a directory.
video: false

output:
  filename: pusht_results.txt
  # null writes next to the checkpoint. A path collects results and videos.
  directory: null

# AdaJEPA visual shifts. Each flag is independent and off by default.
# Image corruptions run on the live observation, the initial frame, and the
# goal image. Colors are PushT variation values; the initial frame and the
# goal are re-rendered with those colors before any image corruption.
#
#   visual.blur=true                 Gaussian σ=2.0, kernel 13×13
#   visual.blur=3.0                  same kernel rule at another σ
#   visual.salt_pepper=true          snp1, density 0.01 salt and 0.01 pepper
#   visual.salt_pepper=0.05          snp5
#   visual.dark=true                 multiply pixels by 0.5
#   visual.agent_color=red           blue agent -> pygame Red (255, 0, 0)
#   visual.block_color=red           light-gray T -> (255, 0, 0)
#   visual.anchor_color=red          light-green anchor -> (255, 0, 0)
visual:
  blur: false
  salt_pepper: false
  dark: false
  agent_color: null
  block_color: null
  anchor_color: null
