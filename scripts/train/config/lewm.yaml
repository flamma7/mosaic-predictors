defaults:
  - _self_
  - launcher: local
  - data: pusht

output_model_name: lewm
subdir: ${hydra:job.id}

num_workers: 8
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: tiny
embed_dim: 192
# Concatenate a proprio embedding onto the CLS latent and include it in
# the prediction target. DINO-WM repeats that vector across patches; LeWM
# has one token, so it is concatenated once. The predictor width becomes
# embed_dim + proprio_emb_dim. Actions stay beside the latent.
use_proprio: true
proprio_emb_dim: 10
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 10
  devices: auto
  accelerator: gpu
  precision: bf16 #16-mixed
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

val_loader:
  batch_size: ${loader.batch_size}
  num_workers: ${num_workers}
  drop_last: False
  persistent_workers: True
  prefetch_factor: ${loader.prefetch_factor}
  pin_memory: ${loader.pin_memory}
  shuffle: False

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 1

# After each validation epoch, on the weights just saved. The regular
# val/* loss is unchanged. Success rates are percents. MSE is the latent
# error against the perturbed encoding. Proprio, when enabled, is part of
# that latent. The dataset action at the scored frame conditions the next
# step; it is not part of the latent.
# Train, val, MSE, and MPC all read data.dataset (config/data/pusht.yaml).
# Set a perturbation's enabled flag to false to drop it from both logs.
validate_extra:
  enabled: true
  every_n_epochs: 1
  mse:
    enabled: true
    # Model steps rolled out after the history window. Clips are
    # history_size + pred_length frames from the validation split.
    pred_length: 25
    horizons: [1, 5, 10, 15, 25]
    # null scores every validation clip long enough for the rollout.
    num_samples: 64
  mpc:
    enabled: true
    num_eval: 25
    seed: ${seed}
    goal_offset_steps: 25
    eval_budget: 50
    horizon: 5
    receding_horizon: 5
    action_block: ${data.dataset.frameskip}
    num_samples: 300
    n_steps: 30
    topk: 30
    var_scale: 1.0
    env_name: swm/PushT-v1
  perturbations:
    none:
      enabled: true
    blur:
      enabled: true
      blur: true
    snp1:
      enabled: true
      salt_pepper: true
    snp5:
      enabled: true
      salt_pepper: 0.05
    dark:
      enabled: true
      dark: 0.7
    red-agent:
      enabled: true
      agent_color: red
    red-block:
      enabled: true
      block_color: red
    red-anchor:
      enabled: true
      anchor_color: red

model:
  _target_: stable_worldmodel.wm.lewm.LeWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.lewm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  proprio_encoder:
    _target_: stable_worldmodel.wm.lewm.module.Embedder
    input_dim: ???
    emb_dim: ${proprio_emb_dim}
  projector:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.lewm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true

loss:
  sigreg:
    weight: 0.1
    kwargs:
      knots: 17
      num_proj: 1024
    # Collapse scalars on post-projection embeddings: variance_mean,
    # effective_rank_frac, mean_rms. CPU buffers, not in the training loss.
    diagnostics:
      enabled: true
      buffer_size: 8192
      sample_every: 16
      sample_size: 48
      log_every: 400
      min_samples: 2048
      eps: 1.0e-12
      background: true
