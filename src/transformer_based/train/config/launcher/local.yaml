# @package _global_
# Local launcher configuration (no SLURM)

defaults:
  - override /hydra/launcher: basic

n_gpus: 1
cpus_per_task: 8
cache_dir: null # Use stable-worldmodel default cache
wandb:
  enabled: true
  config:
    entity: flamma7-myself
    project: mosaic-tmp
    name: ${output_model_name}
    id: ${subdir}
    resume: allow
    log_model: False

# Uploads weights_epoch_*.pt, config.json, and config.yaml to an existing
# HF model repo. Auth: HF_TOKEN env var, or `huggingface-cli login`.
hf:
  enabled: true
  repo_id: flamma77/mosaic_predictors
  path_prefix: ${output_model_name}
